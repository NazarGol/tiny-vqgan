<!doctype html><meta charset="utf-8"><title>search comparison</title><body style="background:#404040;color:#eee;font:13px monospace"><pre id="log"></pre><canvas id="sheet"></canvas>
<script type="module">
// Real-CLIP search (ONNX decoder + MobileCLIP, lib/search.js) vs token-space search (engine) on the same prompts and masks.
// Both results are decoded by the ORIGINAL decoder and scored by REAL CLIP; the tiny decoder's view of the token result is shown too.
import { loadOrt, fetchCached, fetchJsonCached } from '../lib/models.js';
import { Decoder } from '../lib/decoder.js';
import { Clip, dot } from '../lib/clip.js';
import { Palette } from '../lib/palette.js';
import { Bank } from '../lib/bank.js';
import { Painter } from '../lib/search.js';
import { noisyMask } from '../lib/mask.js';
import { resizeCHW } from '../lib/image.js';
import { Engine } from '../engine/engine.js';
const q = new URLSearchParams(location.search), M = q.get('models') || '/models/', base = q.get('base') || './testmodels/', seconds = +(q.get('seconds') || 8), nPrompts = +(q.get('n') || 10), batch = +(q.get('batch') || 32);
const MODES = (q.get('modes') || 'clip,prefilter,token').split(',').filter(Boolean);   // engine search modes, one column each
const PROMPTS = ['a face', 'a red forest', 'the sea at night', 'a city street', 'green hills under a blue sky', 'a cat', 'a lighthouse in a storm', 'a bowl of oranges', 'snow on a mountain', 'a crowded market', 'deadline on Friday', 'a yellow bicycle', 'flowers in a vase', 'a dark room with one candle', 'waves crashing on rocks', 'coffee in the morning'];
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const res = { ok: false, rows: [] };
try {
  const ort = await loadOrt(q.get('ort') || '/node_modules/onnxruntime-web/dist/'); ort.env.wasm.numThreads = 1; ort.env.wasm.proxy = false;
  const decoder = await Decoder.create(ort, await fetchCached(M + 'decoder_fp16.onnx'), { ep: 'webgpu' });
  const clip = await Clip.create(ort, { visionBuf: await fetchCached(M + 'mobileclip_s0/onnx/vision_model_fp16.onnx'), textBuf: await fetchCached(M + 'mobileclip_s0/onnx/text_model_fp16.onnx'), tokenizerJson: await fetchJsonCached(M + 'mobileclip_s0/tokenizer.json') });
  const palette = await Palette.load(M + 'palette/'), bank = await Bank.load(M + (q.get('bank') || 'bank') + '/');
  const painter = new Painter({ decoder, clip, palette, bank });
  const eng = await Engine.load({ base, variant: q.get('variant') || 'A', scorer: q.get('scorer') || 'S', bank: q.get('bank') || 'bank', fetchBuf: (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.arrayBuffer(); }) });
  log('loaded both stacks');
  const realScore = async (tokens, crop, target) => { const img = await decoder.decode(tokens, crop.h, crop.w); const [e] = await clip.embedImages(resizeCHW(img.data, img.w, img.h, 256, 256), 1); return { score: dot(e, target), img }; };
  const toCanvas = (img) => { const c = document.createElement('canvas'); c.width = img.w; c.height = img.h; const g = c.getContext('2d'); const id = g.createImageData(img.w, img.h); if (img.rgba) id.data.set(img.rgba); else { const n = img.w * img.h; for (let i = 0; i < n; i++) { id.data[i * 4] = img.data[i] * 255; id.data[i * 4 + 1] = img.data[n + i] * 255; id.data[i * 4 + 2] = img.data[2 * n + i] * 255; id.data[i * 4 + 3] = 255; } } g.putImageData(id, 0, 0); return c; };
  const T = 192, cols = 2 + MODES.length, sheet = document.getElementById('sheet'); sheet.width = cols * (T + 4) + 240; sheet.height = nPrompts * (T + 6) + 24; const sg = sheet.getContext('2d'); sg.fillStyle = '#404040'; sg.fillRect(0, 0, sheet.width, sheet.height);
  const names = { clip: 'tiny decoder + real CLIP (shaders)', prefilter: 'scorer pre-filter + real CLIP', token: 'token scorer only' };
  sg.fillStyle = '#fff'; sg.font = '12px sans-serif'; sg.fillText('prompt', 4, 16); sg.fillText('ORT: real CLIP search (orig decoder)', 240, 16);
  MODES.forEach((m, i) => sg.fillText(names[m] || m, 240 + (i + 1) * (T + 4), 16)); sg.fillText('ORT result through the tiny decoder', 240 + (MODES.length + 1) * (T + 4), 16);
  // canvas: the first half of the prompts paint on blank, the second half over the previous stroke (painted canvas)
  const gridA = { w: 64, h: 64, tokens: new Int32Array(64 * 64).fill(6328) }, gridB = { w: 64, h: 64, tokens: new Int32Array(64 * 64).fill(6328) };
  for (let i = 0; i < nPrompts; i++) {
    const prompt = PROMPTS[i % PROMPTS.length], target = await clip.embedText(prompt);
    const radius = 3.5 + (i % 3), mask = noisyMask({ cx: 20 + (i % 2) * 6, cy: 20 + (i % 2) * 6, radius, gridW: 64, gridH: 64, seed: 100 + i });
    const before = gridA.tokens.slice();
    const tA = performance.now(); const A = await painter.paint({ grid: gridA, mask, target, seconds, margin: 2 }); const secA = (performance.now() - tA) / 1000;
    const rA = { score: A.score, img: A.image }; const row = { prompt, crop: `${A.crop.w}x${A.crop.h}`, A: { real: rA.score, tries: A.steps, sec: secA }, modes: {} };
    const y = 24 + i * (T + 6); sg.fillStyle = '#fff'; sg.font = '12px sans-serif'; sg.fillText(prompt, 4, y + 14); sg.font = '10px sans-serif'; sg.fillText(`ORT: real ${rA.score.toFixed(3)}, ${A.steps} tries, ${secA.toFixed(1)} s`, 4, y + 30);
    sg.drawImage(toCanvas(rA.img), 240, y, T, T);
    for (let mi = 0; mi < MODES.length; mi++) {
      const mode = MODES[mi]; gridB.tokens.set(gridA.tokens);   // same starting canvas as A for every mode (A's result is not copied: reset to the pre-stroke state)
      gridB.tokens.set(before);
      const tB = performance.now(); const B = await eng.paintStroke({ grid: gridB, mask, target, seconds, margin: 2, batch, mode }); const secB = (performance.now() - tB) / 1000;
      const rB = await realScore(B.tokens, B.crop, target);
      row.modes[mode] = { real: rB.score, own: B.score, tries: B.steps, clipEvals: B.clipEvals, tokenEvals: B.tokenEvals, sec: secB };
      sg.fillText(`${mode}: real ${rB.score.toFixed(3)} (own ${B.score.toFixed(3)}), ${B.steps} tries, ${secB.toFixed(1)} s`, 4, y + 44 + mi * 13);
      sg.drawImage(toCanvas(rB.img), 240 + (mi + 1) * (T + 4), y, T, T);
      if (mi === MODES.length - 1) { const tinyA = eng.decode(A.tokens, A.crop.h, A.crop.w); sg.drawImage(toCanvas(tinyA), 240 + (mi + 2) * (T + 4), y, T, T); }
    }
    gridB.tokens.set(gridA.tokens);   // next prompt paints over A's result on both grids (same canvas)
    res.rows.push(row); log(`${prompt}: ORT ${rA.score.toFixed(3)} (${A.steps} tries) | ` + MODES.map((m) => `${m} ${row.modes[m].real.toFixed(3)} (${row.modes[m].tries} tries, ${row.modes[m].sec.toFixed(1)}s)`).join(' | '));
  }
  const mean = (f) => res.rows.reduce((s, r) => s + f(r), 0) / res.rows.length;
  res.summary = { meanRealA: mean((r) => r.A.real), meanSecA: mean((r) => r.A.sec) };
  for (const m of MODES) res.summary[m] = { meanReal: mean((r) => r.modes[m].real), wins: res.rows.filter((r) => r.modes[m].real >= r.A.real).length, meanSec: mean((r) => r.modes[m].sec), meanTries: mean((r) => r.modes[m].tries), ownMinusReal: mean((r) => r.modes[m].own - r.modes[m].real) };
  log(JSON.stringify(res.summary)); res.ok = true;
} catch (e) { res.error = e.message + '\n' + e.stack; log('ERROR ' + e.message); console.error(e); }
window.__result = res;
</script></body>
